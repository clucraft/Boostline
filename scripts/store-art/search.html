<!doctype html>
<!-- App Store search results image, laid out at 1920×1280 and captured at 2× (3840×2560).
     Apple's safe area is x 836–3004, y 765–1795 (418–1502, 382.5–897.5 here); open with ?safe
     to see it. The phone screens come from scripts/checks/mobile-screens.cjs (OUTDIR=hero-iphone). -->
<html>
<head>
<meta charset="utf-8">
<title>Boostline search results</title>
<style>
  @font-face { font-family: Inter; font-weight: 500; src: url(../../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 800; src: url(../../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2); }
  :root { --bg: #050505; --text: #ededee; --muted: #a1a1a9; --accent: #ffad33; --info: #38bdf8; }
  html, body { margin: 0; width: 1920px; height: 1280px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: Inter, sans-serif; color: var(--text); }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(34% 42% at 66% 58%, rgba(255, 157, 10, 0.17), transparent 70%),
      radial-gradient(26% 30% at 30% 52%, rgba(56, 189, 248, 0.05), transparent 70%);
  }
  svg.bg { position: absolute; inset: 0; }

  .copy { position: absolute; left: 430px; top: 470px; width: 470px; }
  .copy h1 { margin: 0; font-weight: 800; font-size: 80px; line-height: 1; letter-spacing: -0.035em; }
  .copy h1 span { color: var(--accent); }
  .chips { display: flex; gap: 12px; margin-top: 36px; }
  .chip {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px;
    border: 2px solid #2d2d32; background: #0f0f11; font-weight: 600; font-size: 26px; color: #d4d4d8;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

  /* Phones: a 402×874 pt screen with a 62 pt status bar above the app. */
  .phone {
    --w: 380px;
    position: absolute; width: var(--w); padding: calc(var(--w) * 0.032); box-sizing: border-box;
    border-radius: calc(var(--w) * 0.155); background: linear-gradient(145deg, #3a3a40, #16161a 40%, #0b0b0d 70%, #2a2a2f);
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.75), 0 0 0 1.5px #4a4a52 inset;
  }
  .screen {
    position: relative; overflow: hidden; background: #000; border-radius: calc(var(--w) * 0.125);
    aspect-ratio: 402 / 874;
  }
  .screen img { position: absolute; left: 0; top: calc(100% * 62 / 874); width: 100%; display: block; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: calc(100% * 62 / 874); }
  .status .time { position: absolute; left: 12%; top: 34%; font-weight: 600; font-size: calc(var(--w) * 0.042); }
  .status .island {
    position: absolute; left: 50%; top: 20%; width: 31%; height: 58%; transform: translateX(-50%);
    background: #000; border-radius: 999px; box-shadow: 0 0 0 1px #151517;
  }
  .status .icons { position: absolute; right: 9%; top: 36%; display: flex; gap: 5px; align-items: center; }
  .front { --w: 380px; left: 990px; top: 430px; transform: rotate(-4deg); z-index: 2; }
  .back { --w: 350px; left: 1215px; top: 392px; transform: rotate(7deg); z-index: 1; }
  .back .screen::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.18); }

  .safe { display: none; position: absolute; left: 418px; top: 382.5px; width: 1084px; height: 515px; outline: 3px dashed #ff2bd6; z-index: 9; }
  .safe-on .safe { display: block; }
</style>
</head>
<body>
<div class="glow"></div>
<svg class="bg" id="bg" viewBox="0 0 1920 1280" width="1920" height="1280"></svg>

<div class="copy">
  <h1>See what your engine is <span>doing.</span></h1>
  <div class="chips">
    <div class="chip"><i></i>Live</div>
    <div class="chip"><i></i>Logs</div>
    <div class="chip"><i></i>Dyno</div>
    <div class="chip"><i></i>Drag</div>
  </div>
</div>

<div class="phone back"><div class="screen"><div class="status"></div><img src="../../.checks/screens/hero-iphone/3-dyno.png"></div></div>
<div class="phone front"><div class="screen"><div class="status"></div><img src="../../.checks/screens/hero-iphone/1-live.png"></div></div>
<div class="safe"></div>

<script>
  if (location.search === '?safe') document.body.classList.add('safe-on')

  for (const s of document.querySelectorAll('.status')) {
    s.innerHTML = `<div class="time">9:41</div><div class="island"></div>
      <div class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11"><g fill="#ededee"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></g></svg>
        <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 10.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0zM3.6 6.2a5.6 5.6 0 0 1 7.8 0l1.4-1.6a7.8 7.8 0 0 0-10.6 0zM0.6 2.8a10 10 0 0 1 13.8 0" fill="#ededee" stroke="#ededee" stroke-width="0.6"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="#ededee" stroke-opacity="0.5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#ededee"/><rect x="23" y="4" width="1.6" height="4" rx="0.8" fill="#ededee" fill-opacity="0.5"/></svg>
      </div>`
  }
  // Scale the status bar icons with the phone.
  for (const p of document.querySelectorAll('.phone')) {
    const w = parseFloat(getComputedStyle(p).getPropertyValue('--w'))
    p.querySelector('.icons').style.zoom = (w / 402) * 1.05
  }

  // Faint dyno-sheet grid and curves in the background, as on the header.
  const torque = (rpm) => {
    const spool = 0.42 + 0.58 / (1 + Math.exp(-(rpm - 1800) / 180))
    const fade = rpm < 4200 ? 1 : 1 - Math.pow((rpm - 4200) / 2800, 1.6) * 0.26
    return 612 * spool * fade
  }
  const power = (rpm) => (torque(rpm) * rpm) / 7121
  const x = (rpm) => 960 + (rpm - 4650) * 0.33
  const yPower = (hp) => 1230 - (hp / 450) * 420
  const yTorque = (nm) => 1220 - ((nm - 200) / 412) * 360
  const path = (fn) => {
    const pts = []
    for (let rpm = 1400; rpm <= 7900; rpm += 20) pts.push(`${x(rpm).toFixed(1)},${fn(rpm).toFixed(1)}`)
    return 'M' + pts.join(' L')
  }
  const svg = document.getElementById('bg')
  svg.innerHTML = `
    <defs>
      <radialGradient id="fade" cx="55%" cy="60%" r="60%">
        <stop offset="0" stop-color="#fff" stop-opacity="1"/>
        <stop offset="0.7" stop-color="#fff" stop-opacity="0.3"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="m"><rect width="1920" height="1280" fill="url(#fade)"/></mask>
      <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
        <feGaussianBlur stdDeviation="8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`
  const grid = []
  for (let rpm = 1500; rpm <= 7900; rpm += 500) grid.push(`<line x1="${x(rpm)}" y1="0" x2="${x(rpm)}" y2="1280"/>`)
  for (let y = 40; y <= 1280; y += 76) grid.push(`<line x1="0" y1="${y}" x2="1920" y2="${y}"/>`)
  svg.innerHTML += `<g mask="url(#m)" stroke="#fff" stroke-opacity="0.06" stroke-width="1.5">${grid.join('')}</g>
    <g mask="url(#m)" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.5">
      <path d="${path((r) => yTorque(torque(r)))}" stroke="#38bdf8" stroke-width="5"/>
      <path d="${path((r) => yPower(power(r)))}" stroke="#ffad33" stroke-width="6"/>
    </g>`
</script>
</body>
</html>
