name: iOS

# Builds the iOS app (unsigned, for the Simulator) with Xcode 27.1, then runs it against the
# fake BMW gateway from the tests: the app connects over TCP through the native plugin, streams,
# saves a log, and writes the outcome to Documents/smoke.json (src/mobile/smoke.ts). The full
# run, with the BMW data import, is on an iPhone Duo; a quick connect-and-capture run checks a
# regular iPhone. Runs on pull requests that touch the app, or by hand (Actions → iOS → Run
# workflow), so it doesn't use macOS minutes on every push to main.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'native/**'
      - 'test/fakeGateway.ts'
      - 'test/gatewayServer.ts'
      - 'capacitor.config.ts'
      - 'vite.mobile.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    # Xcode 27 image (Apple Silicon): Xcode 27.1, whose iOS 27.1 SDK lets the app fill the iPhone
    # Duo's inner screen, and the iPhone Duo simulator.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mobile:build
      - run: npx cap sync ios
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone (Duo|18 Pro) ' || true
      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log | grep -E 'error:|warning: .*Boostline|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build/xcodebuild.log

      - name: Start the fake BMW gateway
        run: |
          npx esbuild test/gatewayServer.ts --bundle --platform=node --outfile=build/gateway.cjs --log-level=warning
          node build/gateway.cjs build/gateway.port > build/gateway.log 2>&1 &
          for i in $(seq 1 50); do [ -s build/gateway.port ] && break; sleep 0.2; done
          echo "Gateway on port $(cat build/gateway.port)"

      - name: Run the app in the iPhone Duo and iPhone 18 Pro Simulators
        run: |
          udid() {
            xcrun simctl list devices available -j | python3 -c "import json, sys; d = json.load(sys.stdin)['devices']; print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'] == sys.argv[1]))" "$1"
          }
          # smoke <device name> <output name> [import]: launches the app, waits for smoke.json,
          # keeps a screenshot, the result and the console log as build/<output name>-*.
          smoke() {
            local dev env
            dev=$(udid "$1")
            echo "::group::$1 ($dev)"
            xcrun simctl boot "$dev"
            xcrun simctl bootstatus "$dev" -b
            xcrun simctl install "$dev" build/ios/Build/Products/Debug-iphonesimulator/App.app
            env="SIMCTL_CHILD_BOOSTLINE_AUTOCONNECT=mhd-wifi@127.0.0.1:$(cat build/gateway.port) SIMCTL_CHILD_BOOSTLINE_CAPTURE_SECONDS=8"
            [ "$3" = import ] && env="$env SIMCTL_CHILD_BOOSTLINE_IMPORT_BMW=1"
            env $env xcrun simctl launch --console-pty "$dev" app.boostline.logger > "build/$2-console.log" 2>&1 &
            local data
            data=$(xcrun simctl get_app_container "$dev" app.boostline.logger data)
            for i in $(seq 1 420); do [ -f "$data/Documents/smoke.json" ] && break; sleep 1; done
            sleep 3
            xcrun simctl io "$dev" screenshot "build/$2.png"
            cp "$data/Documents/smoke.json" "build/$2-smoke.json" || true
            echo "--- smoke.json"; cat "build/$2-smoke.json" || true
            [ "$3" = import ] && { echo "--- BMW data import"; grep '\[bmw\]' "build/$2-console.log" | tail -n 8 || true; }
            echo "--- app console (first 60 lines)"; head -n 60 "build/$2-console.log" || true
            head -c 3000000 "build/$2-console.log" > "build/$2-console-head.log" || true
            xcrun simctl terminate "$dev" app.boostline.logger || true
            xcrun simctl shutdown "$dev" || true
            echo "::endgroup::"
            grep -q '"ok": true' "build/$2-smoke.json"
          }
          status=0
          smoke "iPhone Duo" iphone-duo import || status=1
          smoke "iPhone 18 Pro" iphone-18-pro || status=1
          echo "--- gateway"; tail -n 5 build/gateway.log || true
          exit $status

      # Logs and screenshots for looking into a run; a full storage quota doesn't fail the check.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ios-build
          retention-days: 14
          path: |
            build/xcodebuild.log
            build/*-console-head.log
            build/*-smoke.json
            build/iphone-*.png
            build/gateway.log
          if-no-files-found: ignore
